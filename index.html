<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 우리 집 귀신 탐지기 V2.1</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <style>
        :root { --primary: #ff4757; --dark: #000000; --card: #121212; --text: #ffffff; --accent: #ff9f43; }
        body { background: var(--dark); color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .container { text-align: center; width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; background: var(--card); border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(255, 71, 87, 0.4); }
        
        /* 💡 형님이 3초간 꾹 누를 타이틀 (비밀 스위치) */
        h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 5px; text-shadow: 0 0 15px rgba(255, 71, 87, 0.6); cursor: pointer; user-select: none; -webkit-user-select: none; }
        .sub-title { color: #888; margin-bottom: 40px; font-size: 0.9rem; }

        .radar-box { position: relative; width: 200px; height: 200px; margin: 0 auto 50px; border: 4px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(#2b0000, #000); overflow: hidden; }
        .radar-box::after { content: ''; position: absolute; width: 100%; height: 100%; background: linear-gradient(0deg, transparent 50%, rgba(255,71,87,0.2) 50%); animation: radar-beam 2s linear infinite; border-radius: 50%; }
        
        #display-percent { font-size: 2.5rem; font-weight: 900; color: var(--text); text-shadow: 0 0 20px var(--text); transition: 0.1s; z-index: 10; }
        .unit { font-size: 1.2rem; font-weight: 500; }

        .btn-scan { width: 100%; padding: 22px; background: linear-gradient(45deg, var(--primary), #b30000); color: white; border: none; border-radius: 18px; font-size: 1.4rem; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3); }
        .btn-scan:active { transform: scale(0.95); }
        .btn-scan:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        .result-msg { margin-top: 30px; font-size: 1.1rem; color: var(--accent); height: 1.5rem; font-weight: 700; text-shadow: 0 0 10px rgba(255, 159, 67, 0.5); }

        .donation-btn { position: fixed; bottom: 25px; right: 25px; background: var(--card); color: var(--primary); padding: 14px 22px; border: 2px solid var(--primary); border-radius: 50px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: 0.3s; z-index: 100; font-size: 0.85rem; }

        @keyframes radar-beam { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes glitch { 0% { opacity: 0.8; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.05) translateX(2px); } 100% { opacity: 0.8; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="master-trigger">👻 집 귀신 탐지기</h1>
        <div class="sub-title">실시간 영적 주파수를 스캔합니다.</div>
        
        <div class="radar-box">
            <div id="display-percent">0<span class="unit">%</span></div>
        </div>

        <button id="scan-button" class="btn-scan" onclick="scan()">탐지 시작 가즈아!</button>
        
        <div id="result-msg" class="result-msg"></div>
    </div>

    <button class="donation-btn" onclick="copyAccount()">
        <span>🕯️</span> 영가 위로 커피 수혈
    </button>

    <script>
        let isScanning = false;
        let isMasterMode = false;
        let pressTimer;

        const trigger = document.getElementById('master-trigger');
        
        // 💡 [수정] 형님만 알 수 있는 비밀 진동 로직
        ['mousedown', 'touchstart'].forEach(evt => {
            trigger.addEventListener(evt, (e) => {
                pressTimer = setTimeout(() => {
                    isMasterMode = true;
                    // 알림창 대신 미세한 진동(50ms)으로 형님께 신호 발송
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                    console.log("Secret Mode Active"); 
                }, 3000);
            });
        });

        ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
            trigger.addEventListener(evt, () => clearTimeout(pressTimer));
        });

        function scan() {
            if (isScanning) return;
            isScanning = true;
            
            const display = document.getElementById('display-percent');
            const msg = document.getElementById('result-msg');
            const btn = document.getElementById('scan-button');
            
            btn.disabled = true;
            msg.innerText = "자기장 탐지 중...";
            display.style.animation = "none";
            display.style.color = "#ffffff";
            
            let counter = 0;
            const maxTicks = 50; 
            
            const interval = setInterval(() => {
                let currentVal = Math.floor(Math.random() * 101);
                display.innerHTML = `${currentVal}<span class="unit">%</span>`;
                counter++;
                
                if (counter > maxTicks * 0.7) {
                    display.style.animation = "glitch 0.1s infinite";
                }

                if (counter > maxTicks) {
                    clearInterval(interval);
                    isScanning = false;
                    btn.disabled = false;
                    display.style.animation = "none";
                    
                    let finalPercent;
                    const seed = Math.random() * 100;

                    if (isMasterMode) {
                        // 마스터 모드: 95~100% 자극적인 결과 고정
                        finalPercent = Math.floor(Math.random() * 6) + 95; 
                        isMasterMode = false; // 일회용
                    } else {
                        // 일반 모드 확률: 정상(70%), 경고(25%), 귀신(5%)
                        if (seed < 70) finalPercent = Math.floor(Math.random() * 40); 
                        else if (seed < 95) finalPercent = Math.floor(Math.random() * 45) + 40; 
                        else finalPercent = Math.floor(Math.random() * 11) + 90; 
                    }

                    display.innerHTML = `${finalPercent}<span class="unit">%</span>`;

                    if (finalPercent >= 90) {
                        display.style.color = "#ff4757";
                        display.style.animation = "glitch 0.1s infinite";
                        msg.innerText = "🚨 뒤를 돌아보지 마시오.";
                        msg.style.color = "#ff4757";
                        if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
                    } else if (finalPercent >= 40) {
                        display.style.color = "#ff9f43";
                        msg.innerText = "희미한 형체가 감지됨...";
                        msg.style.color = "#ff9f43";
                    } else {
                        display.style.color = "#00d3a5";
                        msg.innerText = "정상 범위입니다. 안심하세요.";
                        msg.style.color = "#00d3a5";
                    }
                }
            }, 80);
        }

        function copyAccount() {
            // 형님의 케이뱅크 계좌번호 적용
            const acc = "케이뱅크 100-210-317446";
            navigator.clipboard.writeText(acc);
            alert("계좌번호가 복사됐습니다. 커피 수혈 부탁드립니다!\n\n" + acc);
        }
    </script>
</body>
</html>
